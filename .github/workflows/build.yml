name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out plug-in
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Check out strange-eons
        uses: actions/checkout@v4
        with:
          repository: christophercurrie/strange-eons
          path: strange-eons

      - name: Resolve strange-eons commit
        id: strange-eons
        working-directory: strange-eons
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache Maven repository
        id: m2-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ steps.strange-eons.outputs.sha }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Install strange-eons to local Maven repo
        if: steps.m2-cache.outputs.cache-hit != 'true'
        working-directory: strange-eons
        run: mvn -B -DskipTests install

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plug-in
        run: ./gradlew build

      - name: Upload plug-in bundle
        uses: actions/upload-artifact@v4
        with:
          name: DeveloperTools.seplugin
          path: build/dist/DeveloperTools.seplugin
          if-no-files-found: error
