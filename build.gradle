import org.gradle.internal.os.OperatingSystem

plugins {
    id 'java'
    id 'net.researchgate.release' version '3.1.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    compileOnly 'ca.cgjennings:strange-eons:1.0-SNAPSHOT'
}

tasks.named('processResources', ProcessResources) {
    def pluginVersion = project.version
    def catalogTs = providers.gradleProperty('catalogTimestamp').get()
    inputs.property('version', pluginVersion)
    inputs.property('catalogTimestamp', catalogTs)
    filesMatching('ca/cgjennings/apps/arkham/plugins/dev-tools.properties') {
        expand(version: pluginVersion)
    }
    filesMatching('eons-plugin') {
        expand(catalogTimestamp: catalogTs)
    }
}

tasks.register('bumpCatalogTimestamp') {
    description = 'Updates catalogTimestamp in gradle.properties to the current time.'
    doLast {
        def gp = file('gradle.properties')
        def now = java.time.LocalDateTime.now()
                .format(java.time.format.DateTimeFormatter.ofPattern('yyyy-MM-dd-HH-mm-ss-SSS'))
        gp.text = gp.text.replaceAll(/(?m)^catalogTimestamp=.*$/, "catalogTimestamp=${now}")
        logger.lifecycle("catalogTimestamp set to ${now}")
    }
}

afterEvaluate {
    tasks.named('beforeReleaseBuild').configure {
        dependsOn 'bumpCatalogTimestamp'
    }
    tasks.named('bumpCatalogTimestamp').configure {
        mustRunAfter 'unSnapshotVersion'
    }
}

release {
    tagTemplate = 'v${version}'
    failOnSnapshotDependencies = false
}

tasks.named('jar') {
    archiveFileName = 'DeveloperTools.seplugin'
    destinationDirectory = layout.buildDirectory.dir('dist')
}

def userPluginsDir = providers.provider {
    def override = System.getenv('STRANGE_EONS_USER_DIR')
    def base
    if (override) {
        base = file(override)
    } else if (OperatingSystem.current().windows) {
        def appdata = System.getenv('APPDATA') ?: System.getProperty('user.home')
        base = file("${appdata}/StrangeEons3")
    } else {
        base = file("${System.getProperty('user.home')}/.StrangeEons3")
    }
    new File(base, 'plug-ins')
}

tasks.register('installPlugin', Copy) {
    description = 'Copies the built plug-in into the local Strange Eons user folder.'
    from tasks.named('jar')
    into userPluginsDir
    onlyIf { userPluginsDir.get().isDirectory() }
}

tasks.named('assemble') {
    finalizedBy 'installPlugin'
}
